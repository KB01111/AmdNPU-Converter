name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend contracts and state
        run: npm test

      - name: Install browser for UI fixtures
        run: npx playwright install chromium

      - name: Test UI workflows with native fixtures
        run: npx playwright test

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test

      - name: Test Python worker behavior
        run: python -m unittest discover -s workers/tests -v

      - name: Compile Python workers
        run: python -m compileall -q workers
